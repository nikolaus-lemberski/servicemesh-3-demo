version: "3"
services:
  service-a:
    build: ./apps/service-a
    container_name: service-a
    image: service-a:latest
    ports:
      - "3000:8080"
    networks:
      - meshdemo
    environment:
      PORT: 8080
      SERVICE_B_HOST: service-b:8080
  service-b:
    build: ./apps/service-b
    container_name: service-b
    image: service-b:latest
    ports:
      - "3001:8080"
    networks:
      - meshdemo
    environment:
      PORT: 8080
      SERVICE_C_HOST: service-c:8080
  service-c:
    build: ./apps/service-c
    container_name: service-c
    image: service-c:latest
    ports:
      - "3002:8080"
    networks:
      - meshdemo
    environment:
      QUARKUS_HTTP_PORT: 8080
networks:
  meshdemo: {}
